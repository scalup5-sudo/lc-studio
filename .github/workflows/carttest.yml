name: carttest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tests/cart.mjs > tests/result.txt 2>&1 || true
      - run: |
          cp cart.png tests/cart.png || true
          git config user.name lc-bot && git config user.email lc-bot@users.noreply.github.com
          git checkout -b results
          git add -f tests/result.txt tests/cart.png || git add -f tests/result.txt
          git commit -m "Résultat test panier"
          git push -f origin results
