name: carttest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tests/cart.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cart
          path: cart.png
