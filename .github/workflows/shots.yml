name: shots
on:
  workflow_dispatch:
    inputs:
      pages:
        default: "/products/couverture-lestee-7-11-15kg-grandes-dimensions"
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tests/shots.mjs || true
        env:
          PAGES: ${{ inputs.pages }}
      - run: |
          git config user.name lc-bot && git config user.email lc-bot@users.noreply.github.com
          git checkout -b shots && git add -f tests/*.png && git commit -m shots && git push -f origin shots
