name: publish
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Construire et déposer le JSONL
        env:
          STAGED: ${{ secrets.STAGED }}
        run: python publish.py
